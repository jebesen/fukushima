<text x="605.5" y="90" font-size="13" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">21,6 %</text>
<text x="605.5" y="90" font-size="13" font-weight="700" fill="#1b2836">21,6 %</text>
