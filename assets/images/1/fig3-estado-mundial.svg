<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 442" width="760" height="442" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Estado del parque nuclear mundial</title><desc id="d">Gráfico de columnas: 441 reactores operables, 81 en construcción, 122 planificados y 336 propuestos en el mundo.</desc>
<rect width="760" height="442" rx="12" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#1b2836">Estado del parque nuclear mundial</text>
<text x="24" y="53" font-size="12.5" fill="#5b6776">Número de reactores según su situación · septiembre de 2026</text>
