<text x="585.0" y="90" font-size="13" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">33,0 %</text>
<text x="585.0" y="90" font-size="13" font-weight="700" fill="#1b2836">33,0 %</text>
<text x="168" y="118" font-size="13" fill="#1b2836" font-weight="400" text-anchor="end">Gas natural</text>
