<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 401" width="760" height="401" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Mix de generación de electricidad en el mundo, 2025</title><desc id="d">Gráfico de barras del mix eléctrico mundial en 2025: carbón 33,0 %, gas 21,8 %, hidráulica 14 %, nuclear 8,9 %, solar 8,7 %, eólica 8,5 % y otras 5,1 %.</desc>
