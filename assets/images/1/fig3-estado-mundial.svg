<line x1="24" x2="736" y1="76.0" y2="76.0" stroke="#e3e8ee"/>
<rect x="147.0" y="102.0" width="76" height="194.0" rx="3" fill="#2b5d94"/>
<text x="185.0" y="95.0" font-size="14" font-weight="700" fill="#1b2836" text-anchor="middle">441</text>
<text x="185.0" y="316" font-size="12.5" font-weight="600" fill="#1b2836" text-anchor="middle">Operables</text>
<text x="185.0" y="331" font-size="11.5" font-weight="400" fill="#5b6776" text-anchor="middle">404 GW(e) netos</text>
<rect x="277.0" y="260.4" width="76" height="35.6" rx="3" fill="#f5a800"/>
<text x="315.0" y="253.4" font-size="14" font-weight="700" fill="#1b2836" text-anchor="middle">81</text>
<text x="315.0" y="316" font-size="12.5" font-weight="600" fill="#1b2836" text-anchor="middle">En construcción</text>
<text x="315.0" y="331" font-size="11.5" font-weight="400" fill="#5b6776" text-anchor="middle">88 GW(e) brutos</text>
<rect x="407.0" y="242.3" width="76" height="53.7" rx="3" fill="#8fb0d6"/>
<text x="445.0" y="235.3" font-size="14" font-weight="700" fill="#1b2836" text-anchor="middle">122</text>
<text x="445.0" y="316" font-size="12.5" font-weight="600" fill="#1b2836" text-anchor="middle">Planificados</text>
<text x="445.0" y="331" font-size="11.5" font-weight="400" fill="#5b6776" text-anchor="middle">111 GW(e) brutos</text>
<rect x="537.0" y="148.2" width="76" height="147.8" rx="3" fill="#c9d8ea"/>
<text x="575.0" y="141.2" font-size="14" font-weight="700" fill="#1b2836" text-anchor="middle">336</text>
<text x="575.0" y="316" font-size="12.5" font-weight="600" fill="#1b2836" text-anchor="middle">Propuestos</text>
<text x="575.0" y="331" font-size="11.5" font-weight="400" fill="#5b6776" text-anchor="middle">299 GW(e) brutos</text>
<text x="24" y="368" font-size="11" fill="#5b6776">Planificados: con aprobaciones o financiación, en su mayoría previstos en los próximos 15 años. Propuestos: con</text>
<text x="24" y="383" font-size="11" fill="#5b6776">programa o emplazamiento, pero con calendario muy incierto.</text>
<text x="24" y="398" font-size="11" fill="#5b6776">Fuente: World Nuclear Association, «Nuclear Power in the World Today» (29/09/2026), con datos del IAEA PRIS.</text>
<text x="24" y="413" font-size="11" fill="#5b6776">Elaboración propia.</text>
