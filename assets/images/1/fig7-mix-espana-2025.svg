<text x="24" y="284" font-size="11" fill="#5b6776">(*) Por diferencia. Las renovables generaron el 55,5 % de la electricidad del conjunto del sistema. La nuclear</text>
<text x="24" y="299" font-size="11" fill="#5b6776">fue la segunda fuente, con el 5 % de la potencia instalada (7,1 GW de 142,5 GW).</text>
<text x="24" y="314" font-size="11" fill="#5b6776">Fuente: Red Eléctrica de España, «El sistema eléctrico español en 2025» (marzo de 2026). Elaboración propia.</text>
