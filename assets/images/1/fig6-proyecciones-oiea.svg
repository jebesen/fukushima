<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Proyecciones de capacidad nuclear mundial del OIEA</title><desc id="d">Gráfico de columnas: 377 GW(e) en 2025; en 2050, 641 en el caso bajo y 1.045 en el alto; en 2060, 696 en el bajo y 1.284 en el alto.</desc>
