<text x="421.0" y="288" font-size="11" fill="#5b6776" text-anchor="middle">20</text>
<line x1="542.5" x2="542.5" y1="70" y2="272" stroke="#e3e8ee"/>
<text x="542.5" y="288" font-size="11" fill="#5b6776" text-anchor="middle">30</text>
<line x1="664.0" x2="664.0" y1="70" y2="272" stroke="#e3e8ee"/>
<text x="664.0" y="288" font-size="11" fill="#5b6776" text-anchor="middle">40</text>
