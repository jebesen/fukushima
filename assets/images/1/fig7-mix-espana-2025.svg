<text x="544.9" y="146" font-size="13" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">18,4 %</text>
<text x="544.9" y="146" font-size="13" font-weight="700" fill="#1b2836">18,4 %</text>
