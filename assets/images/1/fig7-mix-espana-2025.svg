<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" width="760" height="343" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Mix de generación de electricidad en España, 2025</title><desc id="d">Gráfico de barras del mix peninsular español en 2025: eólica 21,6 %, nuclear 19 %, solar fotovoltaica 18,4 %, ciclo combinado 16,8 %, hidráulica 12,4 % y otras tecnologías 11,8 %.</desc>
<rect width="760" height="343" rx="12" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#1b2836">Mix de generación de electricidad en España, 2025</text>
<text x="24" y="53" font-size="12.5" fill="#5b6776">Porcentaje de la generación del sistema peninsular</text>
