<text x="24" y="386" font-size="11" fill="#5b6776">En 2025 había 413 reactores operativos (377,1 GW(e)). El caso alto supone 3,4 veces la capacidad de 2025 en</text>
<text x="24" y="401" font-size="11" fill="#5b6776">2060.</text>
<text x="24" y="416" font-size="11" fill="#5b6776">Fuente: IAEA, «Energy, Electricity and Nuclear Power Estimates for the Period up to 2060» (46.ª edición,</text>
<text x="24" y="431" font-size="11" fill="#5b6776">septiembre de 2026). Elaboración propia.</text>
