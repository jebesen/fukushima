<text x="24" y="312" font-size="11" fill="#5b6776">(*) Petróleo, bioenergía y otras renovables (por diferencia). Las renovables en conjunto suman el 34 % y superan</text>
<text x="24" y="327" font-size="11" fill="#5b6776">al carbón por primera vez en más de un siglo.</text>
<text x="24" y="342" font-size="11" fill="#5b6776">Según el IAEA la nuclear aportó el 8,4 % en 2025 (8,7 % en 2024); la diferencia con Ember se debe a la</text>
<text x="24" y="357" font-size="11" fill="#5b6776">metodología.</text>
<text x="24" y="372" font-size="11" fill="#5b6776">Fuente: Ember, «Global Electricity Review 2026» (mayo de 2026). Elaboración propia.</text>
</svg>
