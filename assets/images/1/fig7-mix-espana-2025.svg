<text x="190.0" y="260" font-size="11" fill="#5b6776" text-anchor="middle">0</text>
<line x1="284.8" x2="284.8" y1="70" y2="244" stroke="#e3e8ee"/>
<text x="284.8" y="260" font-size="11" fill="#5b6776" text-anchor="middle">5</text>
<line x1="379.6" x2="379.6" y1="70" y2="244" stroke="#e3e8ee"/>
<text x="379.6" y="260" font-size="11" fill="#5b6776" text-anchor="middle">10</text>
<line x1="474.4" x2="474.4" y1="70" y2="244" stroke="#e3e8ee"/>
<text x="474.4" y="260" font-size="11" fill="#5b6776" text-anchor="middle">15</text>
<line x1="569.2" x2="569.2" y1="70" y2="244" stroke="#e3e8ee"/>
<text x="569.2" y="260" font-size="11" fill="#5b6776" text-anchor="middle">20</text>
<line x1="664.0" x2="664.0" y1="70" y2="244" stroke="#e3e8ee"/>
<text x="664.0" y="260" font-size="11" fill="#5b6776" text-anchor="middle">25</text>
<text x="180" y="90" font-size="13" fill="#1b2836" font-weight="400" text-anchor="end">Eólica</text>
